name: LinkedIn Job Discovery

on:
  schedule:
    # 12:00 PM EDT (16:00 UTC), 4:00 PM EDT (20:00 UTC), 8:00 PM EDT (00:00 UTC next day)
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install system dependencies for Playwright (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 libgbm1 libxkbcommon0 libnspr4 libnss3 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libx11-xcb1 libxcb-dri3-0

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run job discovery
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python src/main.py

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.run_id }}
          path: '*.log'
          if-no-files-found: ignore
